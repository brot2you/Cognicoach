<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4FC3FF">
<title>CogniCoach — Le Jardin de mémoire</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;600;700&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --px:'Pixelify Sans','Courier New',monospace;
  --body:'Lexend','Segoe UI',system-ui,sans-serif;
  --night:#14122B;--panel:#26224D;--panel2:#332E66;--panel3:#433C80;--edge:#0B0A1A;
  --txt:#FFFFFF;--txt2:#C9C4F2;--txt3:#8E88C4;
  --green:#3DDC84;--green-d:#1E9C55;--blue:#3BA4FF;--blue-d:#1C6BC4;--yellow:#FFCC33;--yellow-d:#D18F00;
  --pink:#FF5FA2;--pink-d:#C02E72;--purple:#9B6BFF;--purple-d:#6537D6;--red:#FF4D5E;--red-d:#B81E33;--orange:#FF9330;--orange-d:#C45E00;
  --soil:#7A4A2C;--soil-d:#55301A;--soil-l:#9A6440;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:#4FC3FF linear-gradient(180deg,#4FC3FF 0%,#8FDCFF 45%,#C9F1FF 70%) fixed;min-height:100%}
body{font-family:var(--body);color:var(--txt);min-height:100vh;line-height:1.5;font-size:16px;padding-bottom:calc(30px + env(safe-area-inset-bottom,0px));background:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font:inherit}
img.px{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
:focus-visible{outline:4px solid var(--yellow);outline-offset:3px}
.hide{display:none!important}
h1,h2,h3,h4{font-family:var(--px);font-weight:700;line-height:1.1;letter-spacing:.5px}

/* DÉCOR FIXE : collines et nuages pixel */
.world{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.cloud{position:absolute;width:8px;height:8px;background:transparent;color:#fff;
  box-shadow:8px 0,16px 0,24px 0,0 8px,8px 8px,16px 8px,24px 8px,32px 8px,-8px 16px,0 16px,8px 16px,16px 16px,24px 16px,32px 16px,40px 16px;
  animation:drift 70s linear infinite;opacity:.95}
.cloud.c2{top:22%!important;transform:scale(1.6);animation-duration:110s;animation-delay:-40s;opacity:.8}
.cloud.c3{top:9%!important;animation-duration:90s;animation-delay:-70s}
@keyframes drift{from{left:-80px}to{left:110%}}
.sunpx{position:absolute;right:8%;top:7%;width:64px;height:64px;background:#FFE14D;box-shadow:0 0 0 8px #FFF3A3,0 0 0 16px rgba(255,243,163,.4);clip-path:polygon(25% 0,75% 0,75% 12%,88% 12%,88% 25%,100% 25%,100% 75%,88% 75%,88% 88%,75% 88%,75% 100%,25% 100%,25% 88%,12% 88%,12% 75%,0 75%,0 25%,12% 25%,12% 12%,25% 12%)}
.hills{position:absolute;left:0;right:0;bottom:0;height:34vh;background:#5BD16A;
  clip-path:polygon(0 30%,8% 30%,8% 20%,18% 20%,18% 12%,30% 12%,30% 22%,42% 22%,42% 30%,55% 30%,55% 16%,66% 16%,66% 6%,78% 6%,78% 18%,90% 18%,90% 26%,100% 26%,100% 100%,0 100%)}
.hills.h2{height:22vh;background:#3DB553;clip-path:polygon(0 20%,12% 20%,12% 34%,26% 34%,26% 18%,40% 18%,40% 8%,52% 8%,52% 24%,70% 24%,70% 14%,84% 14%,84% 30%,100% 30%,100% 100%,0 100%)}
.hills.h3{height:9vh;background:#8A5532;clip-path:polygon(0 25%,100% 25%,100% 100%,0 100%);box-shadow:inset 0 6px 0 #6B3E21}

/* PANNEAUX façon jeu (coins pixel) */
.pxbox{background:var(--panel);box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge),inset 0 4px 0 0 var(--panel3),inset 0 -6px 0 0 #1B1838}
.wrap{max-width:820px;margin:0 auto;padding:14px 16px}
.box{background:var(--panel);padding:20px;margin:4px 4px 22px;box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge),inset 0 4px 0 0 var(--panel3),inset 0 -6px 0 0 #1B1838}
.ttl{font-size:1.7rem;margin-bottom:6px;text-shadow:3px 3px 0 var(--edge)}
.page-ttl{font-family:var(--px);font-size:2rem;color:#fff;text-shadow:3px 3px 0 var(--edge),-2px -2px 0 var(--edge),2px -2px 0 var(--edge),-2px 2px 0 var(--edge);margin:6px 4px 4px}
.page-sub{font-weight:600;color:var(--night);margin:0 4px 16px;font-size:.95rem}
.sub{color:var(--txt2);font-size:.92rem;margin-bottom:14px}
.muted{color:var(--txt3);font-size:.85rem}
.wrap .muted,.wrap .sub{color:var(--night);opacity:.8}
.box .muted,.sheet .muted,.box .sub,.sheet .sub,.pack small{color:var(--txt3);opacity:1}
.box .sub,.sheet .sub{color:var(--txt2)}
.empty{text-align:center;padding:26px 12px;color:var(--txt2)}
.empty .big{display:block;margin:0 auto 10px;font-size:3rem}

/* BOUTONS */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:10px 22px;margin:4px;font-family:var(--px);font-weight:700;font-size:1.15rem;letter-spacing:.5px;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);
  background:var(--c,var(--green));box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge),inset 0 -6px 0 0 var(--cd,var(--green-d)),inset 0 4px 0 0 rgba(255,255,255,.35);transition:transform .06s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(3px);box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge),inset 0 -2px 0 0 var(--cd,var(--green-d)),inset 0 4px 0 0 rgba(0,0,0,.15)}
.b-main{--c:var(--green);--cd:var(--green-d)}
.b-water{--c:var(--blue);--cd:var(--blue-d)}
.b-petal{--c:var(--pink);--cd:var(--pink-d)}
.b-gold{--c:var(--yellow);--cd:var(--yellow-d);color:#3A2600;text-shadow:none}
.b-purple{--c:var(--purple);--cd:var(--purple-d)}
.b-soft{--c:var(--panel3);--cd:var(--panel2)}
.b-danger{--c:var(--red);--cd:var(--red-d)}
.b-sm{min-height:38px;padding:5px 14px;font-size:.98rem}
.b-full{width:calc(100% - 8px)}
.btn[disabled]{opacity:.4;cursor:default;filter:grayscale(.5)}
.row{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.row.c{justify-content:center}

/* ÉCRAN TITRE */
.title{min-height:92vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px;gap:10px}
.logo-big{font-family:var(--px);font-weight:700;font-size:clamp(3rem,13vw,5.6rem);line-height:.9;color:var(--yellow);letter-spacing:2px;
  text-shadow:0 6px 0 var(--orange-d),5px 5px 0 var(--edge),-4px -4px 0 var(--edge),4px -4px 0 var(--edge),-4px 4px 0 var(--edge),0 10px 0 var(--edge);animation:float 3s ease-in-out infinite}
.logo-big span{display:block;color:#fff;text-shadow:0 6px 0 var(--blue-d),5px 5px 0 var(--edge),-4px -4px 0 var(--edge),4px -4px 0 var(--edge),-4px 4px 0 var(--edge),0 10px 0 var(--edge)}
@keyframes float{50%{transform:translateY(-8px)}}
.tagline{display:inline-block;background:var(--pink);color:#fff;font-family:var(--px);font-size:1.15rem;padding:4px 14px;margin-top:14px;transform:rotate(-3deg);box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.title-sprites{display:flex;gap:10px;align-items:flex-end;justify-content:center;margin:18px 0 6px}
.title-sprites img{animation:hop 1.2s ease-in-out infinite}
.title-sprites img:nth-child(2){animation-delay:.15s}.title-sprites img:nth-child(3){animation-delay:.3s}.title-sprites img:nth-child(4){animation-delay:.45s}.title-sprites img:nth-child(5){animation-delay:.6s}.title-sprites img:nth-child(6){animation-delay:.75s}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
.press{font-family:var(--px);font-size:1.3rem;color:#fff;text-shadow:3px 3px 0 var(--edge);animation:blink 1s steps(2) infinite;margin-top:6px}
@keyframes blink{50%{opacity:0}}
.btn-start{font-size:1.7rem;min-height:66px;padding:12px 44px;margin-top:6px}
.dialog{width:100%;max-width:440px;text-align:left;margin-top:12px}
.dialog .who{display:inline-block;background:var(--yellow);color:#3A2600;font-family:var(--px);font-weight:700;padding:2px 10px;margin:-34px 0 10px -6px;box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.dialog p{font-size:1rem}
.roles{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.role{padding:14px 6px;font-family:var(--px);font-weight:700;font-size:1.15rem;background:var(--panel2);box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),inset 0 -5px 0 #1B1838}
.role span{display:block;font-size:2rem;margin-bottom:2px}
.role.on{background:var(--blue);box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),inset 0 -5px 0 var(--blue-d)}
.field{margin-bottom:12px;text-align:left}
.field label{display:block;font-family:var(--px);font-size:1.02rem;color:var(--yellow);margin-bottom:5px}
.field input,.field select,.field textarea{width:100%;padding:11px 14px;border:none;background:#fff;color:var(--night);font-size:1rem;box-shadow:inset 0 4px 0 #D9D5F5,0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge)}
.field textarea{min-height:130px;resize:vertical;line-height:1.5}
.field input:focus,.field select:focus,.field textarea:focus{outline:4px solid var(--yellow);outline-offset:3px}
.hint{font-size:.8rem;color:var(--txt3);margin-top:6px}

/* HUD */
.hud{position:sticky;top:0;z-index:60;padding:8px 10px;background:var(--night);box-shadow:0 4px 0 var(--edge)}
.hud-in{max-width:820px;margin:0 auto;display:flex;align-items:center;gap:8px}
.hud-back{width:46px;height:46px;font-size:1.3rem;font-family:var(--px);background:var(--panel3);box-shadow:inset 0 -4px 0 var(--panel2),0 0 0 3px var(--edge);flex-shrink:0}
.lvl{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.lvl-badge{width:46px;height:46px;flex-shrink:0;background:var(--purple);display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--px);line-height:1;box-shadow:inset 0 -4px 0 var(--purple-d),0 0 0 3px var(--edge)}
.lvl-badge small{font-size:.6rem;opacity:.85}.lvl-badge b{font-size:1.3rem}
.lvl-info{min-width:0;flex:1}
.lvl-name{font-family:var(--px);font-size:1.05rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xpbar{height:12px;background:var(--edge);padding:2px;margin-top:3px;max-width:220px}
.xpbar i{display:block;height:100%;background:repeating-linear-gradient(90deg,var(--green) 0 6px,#6BF0A6 6px 8px)}
.chipx{display:flex;align-items:center;gap:4px;font-family:var(--px);font-weight:700;font-size:1.15rem;padding:4px 10px;background:var(--panel2);box-shadow:0 0 0 3px var(--edge);white-space:nowrap}
.chipx img{width:20px;height:20px}
.hud-opt{width:46px;height:46px;font-size:1.3rem;background:var(--panel3);box-shadow:inset 0 -4px 0 var(--panel2),0 0 0 3px var(--edge);flex-shrink:0}

/* MENU PRINCIPAL */
.menu{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:6px 4px}
.mbtn{position:relative;min-height:116px;padding:14px 10px 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-family:var(--px);font-weight:700;font-size:1.25rem;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35);
  background:var(--c);box-shadow:0 -4px 0 0 var(--edge),0 4px 0 0 var(--edge),-4px 0 0 0 var(--edge),4px 0 0 0 var(--edge),inset 0 -8px 0 0 var(--cd),inset 0 5px 0 0 rgba(255,255,255,.3);transition:transform .06s}
.mbtn:active{transform:translateY(4px)}
.mbtn:hover{filter:brightness(1.08)}
.mbtn .mi{font-size:2.3rem;line-height:1;filter:drop-shadow(2px 2px 0 rgba(0,0,0,.3))}
.mbtn img{width:48px;height:48px}
.mbtn small{font-family:var(--body);font-weight:500;font-size:.75rem;opacity:.95;text-shadow:none}
.mbtn.hero{grid-column:1/-1;min-height:132px;flex-direction:row;gap:16px;font-size:1.8rem;animation:pulse 1.6s ease-in-out infinite}
.mbtn.hero img{width:64px;height:64px}
@keyframes pulse{50%{filter:brightness(1.12)}}
.mbtn .badge{position:absolute;top:-10px;right:-10px;min-width:34px;height:34px;padding:0 6px;background:var(--red);font-size:1.15rem;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--edge);animation:bob 1s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}
.mbtn.lock{filter:grayscale(.4) brightness(.9)}
.quests{margin-top:18px}
.quest{display:flex;align-items:center;gap:12px;padding:10px 12px;background:var(--panel2);margin-bottom:10px;box-shadow:0 0 0 3px var(--edge)}
.quest .qi{font-size:1.6rem;width:36px;text-align:center}
.quest .qt{flex:1;font-size:.92rem}
.quest .qr{font-family:var(--px);color:var(--yellow);white-space:nowrap}
.quest.done{background:#1E5A3E}
.quest.done .qt{text-decoration:line-through;opacity:.8}
.qhead{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:10px}

/* JARDIN */
.bed{margin-bottom:26px}
.sign{display:inline-block;background:#C98D55;color:#fff;font-family:var(--px);font-weight:700;font-size:1.15rem;padding:4px 14px;margin:0 0 -4px 12px;position:relative;z-index:2;text-shadow:2px 2px 0 rgba(0,0,0,.3);box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),inset 0 -4px 0 #9C6533}
.sign small{font-family:var(--body);font-size:.75rem;font-weight:500}
.soilbed{background-color:var(--soil);background-image:linear-gradient(45deg,var(--soil-d) 25%,transparent 25%,transparent 75%,var(--soil-d) 75%),linear-gradient(45deg,var(--soil-d) 25%,transparent 25%,transparent 75%,var(--soil-d) 75%);background-size:16px 16px;background-position:0 0,8px 8px;
  padding:22px 12px 14px;display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:10px;box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 6px 0 #3EAF4E}
.plant{position:relative;background:var(--soil-l);padding:8px 4px 6px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;min-height:96px;box-shadow:inset 0 -5px 0 var(--soil-d),0 0 0 3px var(--edge);transition:transform .08s}
.plant:hover{transform:translateY(-3px)}
.plant img{width:48px;height:48px;transform-origin:50% 100%}
.plant .lb{font-size:.72rem;line-height:1.2;margin-top:4px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px;color:#FFF3E3}
.plant.thirsty img{filter:grayscale(.75) sepia(.35);transform:rotate(-12deg)}
.plant.thirsty .dropb{position:absolute;top:-12px;right:-8px;width:26px;height:26px;animation:bob 1s ease-in-out infinite}
.plant.grew img{animation:grow .8s steps(4)}
@keyframes grow{0%{transform:scale(.3)}50%{transform:scale(1.4)}100%{transform:scale(1)}}
.legend{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:.8rem;margin-bottom:16px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend img{width:22px;height:22px}
.visitors{display:flex;gap:10px;flex-wrap:wrap;font-size:1.8rem}
.visitors .off{filter:grayscale(1) brightness(.3);opacity:.6}

/* SÉANCE */
.steps{display:flex;gap:8px;margin:0 4px 16px}
.steps div{flex:1;height:14px;background:var(--edge);box-shadow:0 0 0 2px var(--edge)}
.steps div.dn{background:var(--green)}
.steps div.ac{background:var(--yellow)}
.qcard{text-align:center;padding:28px 18px}
.qkicker{font-size:.86rem;color:var(--txt2);margin-bottom:10px}
.qterm{font-family:var(--px);font-size:2.4rem;font-weight:700;line-height:1.15;word-break:break-word;text-shadow:3px 3px 0 var(--edge)}
.qans{font-size:1.35rem;margin-top:16px;padding-top:16px;border-top:4px dashed var(--panel3);color:var(--green);font-weight:600}
.rate{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:0 4px}
.rate button{padding:12px 4px;font-family:var(--px);font-weight:700;font-size:1.1rem;line-height:1.1;color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.3);box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 -6px 0 rgba(0,0,0,.25)}
.rate button:active{transform:translateY(3px)}
.rate button span{display:block;font-size:1.9rem;margin-bottom:4px}
.r0{background:var(--red)}.r1{background:var(--orange)}.r2{background:var(--green)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;padding:0 4px}
.opt{background:#fff;color:var(--night);padding:14px 10px;font-weight:600;font-size:1.02rem;word-break:break-word;box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 -5px 0 #D6D2F2}
.opt:hover:not([disabled]){background:#FFF6CC}
.opt.good{background:var(--green);color:#fff}
.opt.bad{background:var(--red);color:#fff;animation:shake .3s}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{padding:12px 14px;margin:14px 4px;font-size:.95rem;box-shadow:0 0 0 3px var(--edge)}
.fb.good{background:#1E7A4A}.fb.bad{background:#8E2034}.fb.mid{background:#9A5A0E}
.fb b{font-family:var(--px);font-size:1.25rem}
.tip{display:flex;gap:10px;align-items:flex-start;background:var(--panel2);padding:11px 14px;font-size:.88rem;color:var(--txt2);margin:14px 4px 4px;text-align:left;box-shadow:0 0 0 3px var(--edge)}
.tip .ti{font-size:1.3rem}
.harvest{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px;margin:14px 0}
.hv{background:var(--panel2);padding:8px 10px;display:flex;align-items:center;gap:8px;font-size:.85rem;text-align:left;box-shadow:0 0 0 3px var(--edge)}
.hv .ems{display:flex;align-items:center;gap:2px;font-family:var(--px)}
.hv .ems img{width:30px;height:30px}
.calib{background:var(--purple-d);padding:14px;margin:14px 0;font-size:.92rem;text-align:left;box-shadow:0 0 0 3px var(--edge)}
.big-n{font-family:var(--px);font-size:3.6rem;font-weight:700;color:var(--yellow);line-height:1;text-shadow:4px 4px 0 var(--edge);display:flex;align-items:center;justify-content:center;gap:6px}
.big-n img{width:52px;height:52px}
.levelup{background:var(--yellow);color:#3A2600;font-family:var(--px);font-size:1.4rem;padding:10px;margin:10px 0;animation:pulse .8s ease-in-out infinite;box-shadow:0 0 0 3px var(--edge)}

/* ENTRAÎNEMENT */
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin:4px 4px 20px}
.tool{text-align:left;padding:14px;color:#fff;background:var(--c);box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 -6px 0 var(--cd);opacity:.8}
.tool.on{opacity:1;outline:4px solid var(--yellow);outline-offset:4px}
.tool .ic{font-size:1.9rem;display:block;margin-bottom:4px}
.tool b{font-family:var(--px);font-size:1.25rem;display:block;text-shadow:2px 2px 0 rgba(0,0,0,.3)}
.tool small{font-size:.78rem;opacity:.95}
.flip{perspective:900px;max-width:460px;height:240px;margin:6px auto 16px;cursor:pointer}
.flip-in{position:relative;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d;-webkit-transform-style:preserve-3d}
.flip.fl .flip-in{transform:rotateY(180deg)}
.face{position:absolute;inset:4px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center;-webkit-backface-visibility:hidden;backface-visibility:hidden;box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 -8px 0 rgba(0,0,0,.2)}
.face.f{background:var(--blue)}
.face.b{background:var(--pink);transform:rotateY(180deg)}
.face .w{font-family:var(--px);font-size:2.1rem;font-weight:700;line-height:1.15;word-break:break-word;text-shadow:3px 3px 0 rgba(0,0,0,.3)}
.face small{opacity:.9;font-size:.82rem;margin-top:10px}
.dict-in{display:block;width:calc(100% - 8px);margin:4px;padding:14px;border:none;font-size:1.35rem;text-align:center;background:#fff;color:var(--night);box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 5px 0 #D9D5F5}
.dict-in:focus{outline:4px solid var(--yellow);outline-offset:3px}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 4px}
.mcol{display:flex;flex-direction:column;gap:12px}
.mi{background:#fff;color:var(--night);padding:12px 8px;font-weight:600;font-size:.92rem;word-break:break-word;box-shadow:0 -3px 0 var(--edge),0 3px 0 var(--edge),-3px 0 0 var(--edge),3px 0 0 var(--edge),inset 0 -5px 0 #D6D2F2}
.mi.sel{background:var(--yellow)}
.mi.done{background:var(--green-d);color:#D6FFE6;box-shadow:0 0 0 3px var(--edge)}
.mi.no{background:var(--red);color:#fff;animation:shake .3s}
.check{display:flex;gap:10px;align-items:flex-start;padding:8px 0;font-size:.92rem;cursor:pointer}
.check input{width:22px;height:22px;margin-top:1px;accent-color:var(--green);flex-shrink:0}
.sel-mat{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:0 4px 16px;font-family:var(--px);font-size:1.1rem;color:var(--night)}
.sel-mat select{padding:7px 12px;border:none;background:#fff;color:var(--night);font-family:var(--body);box-shadow:0 0 0 3px var(--edge)}
details summary{cursor:pointer}

/* GRAINES */
.nrow{display:flex;align-items:center;gap:10px;padding:10px 4px;border-bottom:3px solid var(--panel2)}
.nrow:last-child{border-bottom:none}
.nrow img{width:36px;height:36px;flex-shrink:0}
.nrow .tx{flex:1;min-width:0}
.nrow .q{font-weight:600}
.nrow .a{font-size:.86rem;color:var(--txt2)}
.del{width:38px;height:38px;color:var(--txt3);font-size:1rem;font-family:var(--px);background:var(--panel2);box-shadow:0 0 0 2px var(--edge)}
.del:hover{background:var(--red);color:#fff}
.packs{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.pack{padding:14px;background:var(--panel2);display:flex;flex-direction:column;gap:6px;box-shadow:0 0 0 3px var(--edge),inset 0 -5px 0 #1B1838}
.pack b{font-family:var(--px);font-size:1.2rem;line-height:1.1}
.pack small{color:var(--txt2);font-size:.8rem}
.pack .btn{margin-top:auto;align-self:flex-start}

/* ASTUCES & PROF */
.tabs{display:flex;gap:10px;overflow-x:auto;padding:4px 4px 10px;margin-bottom:10px;-webkit-overflow-scrolling:touch}
.tab{white-space:nowrap;padding:8px 14px;font-family:var(--px);font-size:1.02rem;background:var(--panel);box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 #1B1838}
.tab.on{background:var(--yellow);color:#3A2600;box-shadow:0 0 0 3px var(--edge),inset 0 -4px 0 var(--yellow-d)}
.adv{background:var(--panel2);padding:16px;margin-bottom:14px;border-left:8px solid var(--green);box-shadow:0 0 0 3px var(--edge)}
.adv h4{font-size:1.3rem;margin-bottom:6px}
.adv p{font-size:.92rem;color:var(--txt2)}
.adv .ex{margin-top:10px;background:var(--panel);padding:9px 12px;font-size:.88rem;color:var(--txt)}
.adv .tag{display:inline-block;font-size:.74rem;font-weight:600;padding:2px 9px;color:#fff}
.t-hi{background:var(--green-d)}.t-md{background:var(--orange-d)}.t-lo{background:var(--pink-d)}
.adv .ap{margin-top:10px;font-size:.88rem}
.adv .ap strong{display:block;font-family:var(--px);font-size:.95rem;color:var(--yellow)}
.adv.prof{border-left-color:var(--blue)}
.gtbl{width:100%;border-collapse:collapse;font-size:.86rem;background:var(--panel2)}
.gtbl th{background:var(--night);padding:9px;text-align:left;font-family:var(--px);font-weight:600}
.gtbl td{padding:9px;border-bottom:2px solid var(--panel);vertical-align:top}
.gtbl td.c{text-align:center}
.gtbl input{width:20px;height:20px;accent-color:var(--yellow)}
.scroll-x{overflow-x:auto}
.linkbox{width:100%;padding:10px;border:none;font-size:.8rem;background:#fff;color:var(--night);word-break:break-all;min-height:70px;box-shadow:0 0 0 3px var(--edge)}

/* FENÊTRES */
.ov{position:fixed;inset:0;background:rgba(11,10,26,.7);display:none;align-items:flex-end;justify-content:center;z-index:200;padding:16px}
.ov.op{display:flex}
.sheet{background:var(--panel);padding:22px;width:100%;max-width:480px;max-height:86vh;overflow-y:auto;animation:pop .2s steps(3);margin-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -4px 0 var(--edge),0 4px 0 var(--edge),-4px 0 0 var(--edge),4px 0 0 var(--edge),inset 0 4px 0 var(--panel3),inset 0 -6px 0 #1B1838}
@media(min-width:600px){.ov{align-items:center}}
@keyframes pop{from{transform:scale(.85);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-size:1.6rem;margin-bottom:10px;text-shadow:3px 3px 0 var(--edge)}
.sheet .acts{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap;margin-top:16px}
#toast{position:fixed;left:50%;top:calc(74px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--yellow);color:#3A2600;font-family:var(--px);font-weight:700;font-size:1.05rem;padding:10px 18px;z-index:300;transition:all .2s steps(3);pointer-events:none;max-width:90vw;text-align:center;box-shadow:0 0 0 4px var(--edge)}
#toast.sh{transform:translate(-50%,0);opacity:1}

@media(max-width:520px){
  .lvl-name{font-size:.95rem}.xpbar{max-width:130px}.chipx{font-size:1rem;padding:3px 7px}
  .opts{grid-template-columns:1fr}.qterm{font-size:1.9rem}.harvest{grid-template-columns:1fr}
  .mbtn{min-height:104px;font-size:1.1rem}.mbtn.hero{font-size:1.5rem}
  #chStreak{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media print{body{background:#fff;color:#000}.world,.hud,.noprint,#toast{display:none!important}.box{box-shadow:none;background:#fff;color:#000}.gtbl,.gtbl th{background:#fff;color:#000}.gtbl td,.gtbl th{border:1px solid #000}}

<script type="application/json" id="data">{"tips":[{"i":"🎯","t":"Se tester, même sur des questions faciles, marche mieux que relire. Ton cerveau retient mieux quand il fait l’effort de chercher."},{"i":"🕐","t":"Revoir dans quelques jours, c’est plus efficace qu’un gros bloc de révision ce soir. Ton cerveau a besoin de temps."},{"i":"🧩","t":"5 à 7 notions à la fois, c’est le max. Mieux vaut 5 choses vraiment sues que 20 vues trop vite."},{"i":"💬","t":"Réexpliquer avec tes propres mots, c’est la preuve que tu as compris — pas juste mémorisé."},{"i":"😴","t":"Le sommeil aide ton cerveau à ranger ce que tu as appris. Réviser avant de dormir, c’est une bonne idée !"},{"i":"✅","t":"Savoir ce qu’on sait vraiment — c’est un skill clé. Tu viens de l’exercer !"},{"i":"🔊","t":"En langues, entendre les mots en même temps que tu les lis booste vraiment la mémorisation. Active l’audio !"},{"i":"🗣","t":"Dire les mots à voix haute pendant que tu révises aide à les ancrer. Essaie de les prononcer !"}],"prods":[{"cat":"Vocabulaire en contexte","q":"Complète : \"Yesterday I _____ to the museum.\" (go)","hint":"Utilise le prétrit du verbe go.","a":"went","chk":"exact"},{"cat":"Reformulation","q":"Reformule à la voix passive : \"The students wrote the essay.\"","hint":"Commence par \"The essay…\"","a":"The essay was written by the students.","chk":"contains"},{"cat":"Traduction guidée","q":"Traduis en anglais : \"Il faut que tu travailles davantage.\"","hint":"Utilise \"You need to…\" ou \"You should…\"","a":"you need to work more","chk":"contains"},{"cat":"Expression","q":"Décris en 2 phrases une chose que tu as faite hier, en anglais.","hint":"Utilise le prétrit : I went, I ate, I watched…","a":null,"chk":"open"},{"cat":"Reformulation","q":"Reformule avec \"although\" : \"She was tired. She finished her homework.\"","hint":"\"Although she was tired, she…\"","a":"although she was tired, she finished","chk":"contains"},{"cat":"Grammaire","q":"Mets au bon temps : \"If I (have) more time, I would learn Japanese.\"","hint":"Conditionnel 2 — subordonnee en \"if\".","a":"had","chk":"exact"},{"cat":"Expression","q":"Écris une phrase avec \"despite\" pour exprimer une concession.","hint":"\"Despite the rain, we…\" ou \"Despite being tired, she…\"","a":null,"chk":"open"}],"cons":{"Mémoriser":[{"title":"Revoir plusieurs fois, pas tout d’un coup","cat":"Mémoriser","text":"Revoir quelque chose plusieurs fois en espaçant les révisions, c’est bien mieux que tout bosser d’un coup la veille. Ton cerveau retient mieux avec du temps entre les sessions.","ex":"Tu apprends 10 mots lundi → revois-les mardi, puis jeudi, puis la semaine d’après. Ça s’ancre vraiment."},{"title":"Te tester plutôt que relire","cat":"Mémoriser","text":"Quand tu te poses des questions sur ce que tu viens d’apprendre, ton cerveau travaille bien plus fort que si tu relis juste. Et ça marche mieux !","ex":"Cache ta leçon. Essaie d’écrire ce dont tu te souviens. Ce que tu as oublié = ce qu’il faut retravailler."},{"title":"Ne pas tout faire en même temps","cat":"Mémoriser","text":"Ton cerveau peut gérer 5 à 7 choses à la fois maximum. Au-delà, c’est la surchauffe — tu lis mais tu ne retiens rien.","ex":"Étudie une notion à la fois. Fais des pauses toutes les 20 min. Téléphone rangé."},{"title":"Réexpliquer avec ses propres mots","cat":"Mémoriser","text":"Relier une info nouvelle à ce que tu sais déjà et l’expliquer avec tes propres mots : c’est le meilleur moyen de vraiment comprendre.","ex":"Après une règle, invente 3 phrases à toi. Explique-la à un camarade ou à voix haute !"},{"title":"Savoir ce qu’on sait (et ce qu’on ne sait pas)","cat":"Mémoriser","text":"Beaucoup d’élèves croient savoir une leçon parce qu’ils l’ont lue. Mais lire ≠ savoir. Se tester honnêtement évite les mauvaises surprises.","ex":"Après chaque révision, trie tes notions : \"Je sais\", \"Pas sûr·e\", \"Je ne sais pas encore\". Travaille surtout les deux dernières."}],"Comprendre à l’oral":[{"title":"Écoute globale d’abord, détail ensuite","cat":"Comprendre à l’oral","text":"La première écoute, c’est pour comprendre le sens général — pas chaque mot. Ne panique pas si tu ne comprends pas tout. C’est normal !","ex":"Demande-toi : Qui parle ? De quoi ? Dans quel contexte ? Ensuite seulement cherche les détails."},{"title":"Utilise le contexte pour deviner","cat":"Comprendre à l’oral","text":"Les mots inconnus, on peut souvent les deviner grâce aux mots autour, au ton de la voix, aux bruits de fond.","ex":"Tu n’entends pas un mot ? Cherche des indices dans le reste de la phrase. Ne reste pas bloqué·e dessus."},{"title":"Entraîne ton oreille chaque jour un peu","cat":"Comprendre à l’oral","text":"L’écoute, ça se travaille régulièrement. Des petites sessions quotidiennes valent bien mieux qu’une longue session par semaine.","ex":"5 min de podcasts, séries, YouTube en anglais par jour — sans sous-titres si possible. Tu verras les progrès !"},{"title":"Repère les mots accentués","cat":"Comprendre à l’oral","text":"En anglais, ce sont les mots importants (noms, verbes, adjectifs) qui sont prononcés fort. Les petits mots (a, the, of…) sont souvent avalés.","ex":"À l’écoute, concentre-toi sur les mots mis en valeur plutôt que d’essayer d’entendre chaque syllabe."}],"Comprendre à l’écrit":[{"title":"Lis le titre et la source en premier","cat":"Comprendre à l’écrit","text":"Avant de lire le texte, regarde le titre, la source, les images. Ça prépare ton cerveau et facilite la compréhension.","ex":"Un titre comme \"Climate change : who pays ?\" te dit déjà beaucoup. Ça active tes connaissances sur le sujet."},{"title":"Identifie les mots transparents","cat":"Comprendre à l’écrit","text":"Les mots qui ressemblent au français sont tes alliés. \"government\", \"conclusion\", \"population\" — tu les comprends déjà !","ex":"Souligne tous les mots que tu peux deviner avant de chercher dans le dictionnaire. Tu en sais souvent plus que tu ne crois."},{"title":"Ne traduis pas mot à mot","cat":"Comprendre à l’écrit","text":"Essaie de comprendre le sens global d’un paragraphe, pas de traduire chaque mot. Ça te ralentit et crée des contresens.","ex":"Lis le paragraphe entier. Demande-toi : quelle est l’idée principale ? Ensuite reviens sur les détails."},{"title":"Repère les connecteurs logiques","cat":"Comprendre à l’écrit","text":"\"However\", \"therefore\", \"although\"… Ces mots indiquent la structure du texte et t’aident à anticiper ce qui vient.","ex":"Souligne les connecteurs. \"However\" = opposition. \"Therefore\" = conséquence. Ça décode la logique du texte."}],"S’exprimer à l’écrit":[{"title":"Planifie avant d’écrire","cat":"S’exprimer à l’écrit","text":"2 minutes de plan évitent 20 minutes de brouillon raté. Note tes idées principales avant de rédiger.","ex":"Idée 1 → argument + exemple. Idée 2 → argument + exemple. Conclusion. Simple et efficace."},{"title":"Utilise des connecteurs variés","cat":"S’exprimer à l’écrit","text":"Les connecteurs structurent ta réponse et montrent que tu maîtrises la langue. Évite de toujours commencer par \"And\".","ex":"\"Firstly… Moreover… However… In conclusion…\" — apprends quelques connecteurs par cœur et utilise-les."},{"title":"Relis avec les yeux du correcteur","cat":"S’exprimer à l’écrit","text":"Après avoir écrit, relis en cherchant spécifiquement les erreurs fréquentes : accord, temps verbaux, majuscules, ponctuation.","ex":"Lis ta production à voix haute. Les phrases étranges ou les erreurs se détectent mieux à l’oral."},{"title":"Enrichis ton vocabulaire actif","cat":"S’exprimer à l’écrit","text":"Un mot appris passivement n’est pas forcément disponible à l’écrit. Il faut pratiquer l’utiliser activement.","ex":"Pour chaque mot nouveau, écris une phrase qui te concerne. \"I feel overwhelmed when…\" ancre le mot dans ta mémoire."}],"S’exprimer à l’oral":[{"title":"Parle, même si ce n’est pas parfait","cat":"S’exprimer à l’oral","text":"L’objectif de la communication, c’est d’être compris·e — pas d’être parfait·e. Les erreurs sont normales et font partie de l’apprentissage.","ex":"Engage-toi dans les échanges, même avec des approximations. \"I think… something like… I mean…\" — ce sont de vraies stratégies !"},{"title":"Prépare des phrases d’amorce","cat":"S’exprimer à l’oral","text":"Quelques formules apprises par cœur te permettent de gagner du temps et d’organiser ta parole.","ex":"\"In my opinion…\", \"I would say that…\", \"That’s a good point, however…\", \"Could you repeat please ?\" — entraîne-toi !"},{"title":"Entraîne-toi à parler seul·e","cat":"S’exprimer à l’oral","text":"La production orale, ça se travaille seul·e aussi. Commenter ses actions en anglais, se raconter sa journée, décrire une image…","ex":"Chaque matin, dis 3 phrases en anglais sur ce que tu vas faire. C’est ridicule ? Oui. Et ça marche."},{"title":"Travaille ta prononciation par l’imitation","cat":"S’exprimer à l’oral","text":"Écouter et répéter un locuteur natif (shadowing) est une des meilleures méthodes pour améliorer son accent.","ex":"Choisis une courte vidéo YouTube. Écoute une phrase. Mets sur pause. Répète exactement la même chose — intonation comprise."}]},"strats":[{"t":"Répétition espacée","i":"🔁","cc":"ccl","d":"Revoir à des intervalles croissants (J+1, J+3, J+7…). Stratégie la plus robuste pour la mémoire à long terme (Ebbinghaus ; Cepeda et al., 2006).","ex":"Programmer des réactivations en début de séance. CogniCoach calcule automatiquement ces intervalles."},{"t":"Test effect / Récupération active","i":"✅","cc":"ccl","d":"Se tester est bien plus efficace que relire (Roediger & Karpicke, 2006). L’effort de récupération renforce durablement la trace mémorielle.","ex":"Proposer des mini-quiz en début de séance plutôt que des résumés à relire."},{"t":"Gestion de la charge cognitive","i":"🧠","cc":"ccm","d":"La théorie de la charge cognitive (Sweller ; diffusée en France notamment par André Tricot) distingue charge intrinsèque, extrinsèque et essentielle. Réduire la charge extrinsèque libère des ressources pour apprendre.","ex":"Interface épurée, consignes courtes, un objectif par séance. Peu d’items nouveaux par session (5 à 7)."},{"t":"Élaboration","i":"💬","cc":"ccm","d":"Connecter les nouvelles informations aux connaissances antérieures enrichit les schémas cognitifs (Ausubel).","ex":"Demander à l’élève de relier la notion nouvelle à ce qu’il connaît déjà."},{"t":"Métacognition / Auto-évaluation","i":"🫞","cc":"cch","d":"La capacité à évaluer précisément sa propre maîtrise est un prédicteur fort de la réussite (Flavell, 1979 ; Hattie, 2009).","ex":"Entraîner les élèves à classer leurs notions en \"Maîtrisé / En cours / À retravailler\"."},{"t":"Interleaving","i":"🔀","cc":"ccm","d":"Mélanger les types de problèmes lors de la révision plutôt que bloquer par catégorie (Kornell & Bjork, 2008).","ex":"Mélanger vocabulaire, grammaire et compréhension dans une même séance de révision."}],"refs":[{"a":"Stephen Krashen","c":"Hypothèse i+1 (Input compréhensible)","d":"L’acquisition se produit quand l’apprenant est exposé à un input légèrement au-dessus de son niveau actuel. Un input trop difficile ou trop facile n’est pas acquisitionnel.","ap":"Calibrer les documents authentiques au niveau réel des élèves. Préférer des textes A2+ pour des élèves A2."},{"a":"Stephen Krashen","c":"Filtre affectif","d":"L’anxiété, le manque de confiance ou la démotivation bloquent l’acquisition même si l’input est compréhensible. Un environnement bienveillant est une condition sine qua non.","ap":"Valoriser les prises de parole imparfaites, éviter la correction publique systématique."},{"a":"Paul Nation","c":"Vocabulaire de haute fréquence","d":"Les 2000 mots les plus fréquents couvrent environ 80% des textes courants. Nation préconise de maîtriser ce noyau avant d’élargir.","ap":"Utiliser des listes de fréquence (GSL, AWL). Prioriser les notions de haute fréquence dans les révisions."},{"a":"Paul Nation","c":"Rencontres répétées (7–10×)","d":"Un mot n’est vraiment acquis qu’après 7 à 10 rencontres dans des contextes variés. Une seule exposition ne suffit pas.","ap":"Planifier des réactivations régulières du même vocabulaire dans des activités différentes."},{"a":"Norbert Schmitt","c":"Connaissance partielle vs totale","d":"Schmitt distingue 9 dimensions de la connaissance d’un mot (forme, sens, usage, collocations…). Savoir traduire un mot ≠ le maîtriser.","ap":"Ne pas se limiter à la traduction. Travailler aussi la prononciation, les collocations, le registre."},{"a":"Merrill Swain","c":"Output hypothesis","d":"La production (orale ou écrite) est un moteur de l’apprentissage — pas seulement un résultat. Produire force à remarquer les lacunes.","ap":"Intégrer des tâches de production régulières, même courtes. La production guide la conscience linguistique."}],"comps":[{"comp":"CO — Compréhension de l’oral","icon":"🎧","cs":[{"t":"Pré-écoute obligatoire","d":"Anticiper le contenu réduit la charge cognitive. Mobiliser les connaissances préalables avant chaque écoute (brainstorming, hypothèses sur le titre/image)."},{"t":"Écoute segmentée","d":"Plusieurs écoutes ciblées valent mieux qu’une écoute exhaustive. 1re : sens global. 2e : éléments précis. 3e si besoin : vérification."},{"t":"Stratégie de compensation","d":"Former les élèves à inférer le sens des mots inconnus grâce au contexte, au ton, aux éléments para-verbaux."}]},{"comp":"CE — Compréhension de l’écrit","icon":"📖","cs":[{"t":"Lecture par étapes","d":"Titre → paratexte → structure → lecture globale → lecture détaillée. Ne pas commencer par une lecture linéaire exhaustive."},{"t":"Activation des connaissances","d":"Avant de lire, activer ce que les élèves savent déjà sur le sujet. Facilite la construction du sens et réduit la charge cognitive."},{"t":"Inférence et tolérance à l’ambiguëté","d":"Former les élèves à tolérer l’incompréhension partielle et à construire une compréhension globale malgré les lacunes lexicales."}]},{"comp":"PE — Production écrite","icon":"✍️","cs":[{"t":"Étayage progressif","d":"Réduire progressivement les aides (cadre, mots-clés, connecteurs fournis) à mesure que l’élève gagne en autonomie."},{"t":"Brouillon obligatoire","d":"Planification → rédaction → révision. Former les élèves à ces trois phases distinctes, même pour des productions courtes."},{"t":"Feedback différé et ciblé","d":"Corriger 2–3 points ciblés plutôt que tout. Un feedback trop dense n’est pas traité. Prioriser ce qui a été enseigné récemment."}]},{"comp":"PO — Production orale","icon":"🗣","cs":[{"t":"Temps de préparation systématique","d":"Un temps de préparation même court (2 min) augmente significativement la qualité de la production. Ne pas demander une réponse immédiate."},{"t":"Interaction avant monologue","d":"L’interaction (dialogues, échanges courts) est plus naturelle et moins anxiogène que le monologue. La pratiquer d’abord."},{"t":"Correction indirecte (recasting)","d":"Reformuler la production de l’élève de façon correcte plutôt que corriger explicitement. Moins intrusif, plus naturel."}]}],"obs":[["Répétition espacée","L’élève revoit ses notions à intervalles réguliers"],["Test effect","L’élève se teste (quiz, flashcards) plutôt que de relire"],["Charge cognitive","L’élève travaille sur peu d’items à la fois et fait des pauses"],["Métacognition","L’élève identifie ce qu’il sait et ce qu’il ne sait pas encore"],["Stratégies CO","L’élève anticipe et utilise le contexte à l’écoute"],["Stratégies CE","L’élève lit par étapes (global puis détail)"],["Stratégies PE","L’élève planifie avant de rédiger"],["Stratégies PO","L’élève prépare avant de prendre la parole"],["Production active","L’élève produit (écrit ou oral) régulièrement"]],"acts":[{"t":"Retrieval practice — 5 min en début de cours","i":"⚡","cc":"ccl","d":"3 questions sur la notion de la séance précédente, sans notes. Réponse individuelle écrite, puis correction collective.","ap":"Peut se faire à l’oral ou à l’écrit. Varier le format pour éviter l’habituation."},{"t":"Exit ticket","i":"🎫","cc":"ccl","d":"En fin de séance, chaque élève écrit 1 chose apprise, 1 question encore ouverte. Feedback immédiat pour l’enseignant.","ap":"Utilisable en 3 min. Anonymiser si les élèves sont intim idés."},{"t":"Input flooding","i":"🌊","cc":"ccm","d":"Saturer un texte avec une structure ou un item lexical cible. L’élève y est exposé de nombreuses fois sans métalangage explicite.","ap":"Écrire un texte où la structure \"used to\" apparaît 8–10 fois. La structure s’acquiert implicitement."},{"t":"Dictogloss","i":"🎙","cc":"ccm","d":"L’enseignant lit un texte court 2 fois. Les élèves prennent des notes. Puis reconstruisent le texte en groupe.","ap":"Choisir un texte riche en structures cibles. La reconstruction favorise la négociation de sens."},{"t":"Think-Pair-Share","i":"👥","cc":"ccl","d":"Temps de réflexion individuelle (1 min), partage avec un camarade, puis partage en classe. Réduit l’anxiété.","ap":"Idéal avant une prise de parole ou une question ouverte. Le temps individuel est crucial."},{"t":"Shadowing","i":"🔊","cc":"ccm","d":"L’élève écoute un locuteur natif et répète simultanément ou avec un léger décalage. Très efficace pour la prosodie.","ap":"Commencer par 30 secondes d’un document audio simple. Progresser en longueur."},{"t":"4/3/2","i":"⏱","cc":"cch","d":"L’élève parle 4 min sur un sujet, puis recommence en 3 min, puis en 2. La répétition dans le temps contraint améliore la fluidité.","ap":"Chaque répétition force l’élève à aller à l’essentiel. Feedback sur la fluidité, pas la correction."}],"refHtml":"<div class=\"rcard\"><div class=\"rauth\">André Tricot<\/div><div class=\"rcpt\">Charge cognitive & apprentissage<\/div><div class=\"rdsc\">Tricot, A. (2017). <em>L’innovation pédagogique<\/em>. Retz. — Tricot, A. & Sweller, J. (2014). Domain-specific knowledge. <em>Educational Psychology Review<\/em>.<\/div><\/div><div class=\"rcard\"><div class=\"rauth\">John Hattie<\/div><div class=\"rcpt\">Visible Learning<\/div><div class=\"rdsc\">Hattie, J. (2009). <em>Visible Learning<\/em>. Routledge. Méta-analyse de 800+ méta-analyses. Stratégies les plus efficaces : feedback, récupération active, enseignement réciproque.<\/div><\/div><div class=\"rcard\"><div class=\"rauth\">Roediger & Karpicke<\/div><div class=\"rcpt\">Test-Enhanced Learning (2006)<\/div><div class=\"rdsc\">Les tests de récupération améliorent davantage la rétention que les sessions de re-lecture. <em>Psychological Science, 17<\/em>(3), 249–255.<\/div><\/div><div class=\"rcard\"><div class=\"rauth\">Éduscol<\/div><div class=\"rcpt\">Neurosciences & neuromythes<\/div><div class=\"rdsc\">Les recommandations efficaces viennent de la psychologie cognitive expérimentale. Éviter : styles d’apprentissage, cerveau gauche/droit, 10% du cerveau. Éduscol (2020).<\/div><\/div>","biblio":[{"a":"Sweller & Tricot","c":"Charge cognitive et connaissances spécifiques","d":"Tricot, A. & Sweller, J. (2014). Domain-specific knowledge and why teaching generic skills does not work. Educational Psychology Review, 26, 265–283. — Tricot, A. (2017). L’innovation pédagogique. Retz."},{"a":"Roediger & Karpicke","c":"Effet test (2006)","d":"Se tester améliore davantage la rétention à long terme que relire. Psychological Science, 17(3), 249–255."},{"a":"Cepeda et al.","c":"Apprentissage espacé (2006)","d":"Méta-analyse : espacer les révisions améliore nettement la mémorisation durable. Psychological Bulletin, 132(3), 354–380."},{"a":"Dunlosky et al.","c":"Techniques d’apprentissage (2013)","d":"Parmi dix techniques évaluées, la pratique de récupération et la pratique espacée sont jugées les plus utiles ; relire et surligner, peu utiles. Psychological Science in the Public Interest, 14(1)."},{"a":"Hattie","c":"Visible Learning (2009)","d":"Synthèse de plus de 800 méta-analyses. Le feedback et la métacognition figurent parmi les leviers les plus forts. Routledge."},{"a":"Éduscol / CSEN","c":"Neurosciences et neuromythes","d":"Les recommandations solides viennent de la psychologie cognitive expérimentale. À éviter : styles d’apprentissage, cerveau gauche/droit, « 10 % du cerveau »."}],"presets":[{"id":"vir","t":"Verbes irréguliers — les incontournables","m":"Anglais","l":"en-GB","i":[["go","went – gone (aller)"],["be","was/were – been (être)"],["have","had – had (avoir)"],["do","did – done (faire)"],["see","saw – seen (voir)"],["take","took – taken (prendre)"],["come","came – come (venir)"],["eat","ate – eaten (manger)"],["write","wrote – written (écrire)"],["buy","bought – bought (acheter)"],["think","thought – thought (penser)"],["find","found – found (trouver)"]]},{"id":"cls","t":"Classroom English","m":"Anglais","l":"en-GB","i":[["Can you repeat, please?","Vous pouvez répéter, s’il vous plaît ?"],["How do you say … in English?","Comment dit-on … en anglais ?"],["I don’t understand.","Je ne comprends pas."],["Can I borrow a pen?","Je peux emprunter un stylo ?"],["What page are we on?","On est à quelle page ?"],["I’ve forgotten my book.","J’ai oublié mon livre."],["Can you spell it?","Vous pouvez l’épeler ?"],["I’m sorry I’m late.","Désolé·e d’être en retard."]]},{"id":"cnx","t":"Connecteurs logiques","m":"Anglais","l":"en-GB","i":[["however","cependant (opposition)"],["therefore","donc (conséquence)"],["although","bien que (concession)"],["moreover","de plus (ajout)"],["because of","à cause de (cause)"],["whereas","alors que (contraste)"],["first of all","tout d’abord"],["in conclusion","pour conclure"]]},{"id":"col","t":"Los colores","m":"Espagnol","l":"es-ES","i":[["rojo","rouge"],["azul","bleu"],["verde","vert"],["amarillo","jaune"],["negro","noir"],["blanco","blanc"],["naranja","orange"],["morado","violet"]]}]}</script>

/* ---------- SÉANCE (rappel actif → quiz → récolte) ---------- */
var SE=null;
function startSeance(){
  var due=dueList().sort(function(a,b){return a.next<b.next?-1:1;});
  var nw=shuf(newList());
  var items=due.slice(0,7);
  var room=7-items.length;if(room>0)items=items.concat(nw.slice(0,Math.min(room,5)));
  if(!items.length){toast('Rien à arroser aujourd’hui');return;}
  SE={items:shuf(items),phase:0,i:0,rate:{},quiz:{},before:{},shown:false};
  each(SE.items,function(n){SE.before[n.id]=n.stage;});
  VIEW='seance';render();window.scrollTo(0,0);
}
function renderSeance(){
  var a=$('app'),N=SE.items.length,h='<div class="row" style="margin-bottom:12px"><button class="btn b-soft b-sm" onclick="quitSeance()">✕ Arrêter</button><span class="page-sub" style="margin:0 0 0 6px">'+(SE.phase===0?'Rappel':SE.phase===1?'Vérification':'Récolte')+(SE.phase<2?' · '+(SE.i+1)+'/'+N:'')+'</span></div>';
  h+='<div class="steps"><div class="'+(SE.phase>0?'dn':'ac')+'"></div><div class="'+(SE.phase>1?'dn':SE.phase===1?'ac':'')+'"></div><div class="'+(SE.phase===2?'ac':'')+'"></div></div>';
  if(SE.phase===0)h+=phaseRappel();else if(SE.phase===1)h+=phaseQuiz();else h+=phaseRecolte();
  a.innerHTML=h;
  if(SE.phase===1&&SE.mode==='type'){var f=$('qin');if(f){f.focus();f.onkeydown=function(e){if(e.keyCode===13)checkType();};}}
}
function quitSeance(){ask('Arrêter la séance ?','Les plantes de cette séance ne seront pas arrosées.','Arrêter',true,function(){SE=null;go('menu');});}
function phaseRappel(){
  var n=SE.items[SE.i],h='<div class="box qcard"><p class="qkicker">'+esc(n.mat)+' · essaie de retrouver la réponse dans ta tête</p><div class="qterm">'+esc(n.q)+'</div>';
  if(n.lang&&hasTTS())h+='<div class="row c" style="margin-top:12px"><button class="btn b-soft b-sm" onclick="speak(SE.items[SE.i].q,SE.items[SE.i].lang)">🔊 Écouter</button></div>';
  if(SE.shown)h+='<div class="qans">'+esc(n.a)+'</div>';
  h+='</div>';
  if(!SE.shown){h+='<button class="btn b-water b-full" onclick="SE.shown=true;renderSeance()">Je me suis creusé la tête : voir la réponse</button>';
    if(SE.i===0)h+=tipBox(D.tips[0]);}
  else h+='<p class="sub" style="text-align:center">Sois honnête : c’est toi que ça aide.</p><div class="rate"><button class="r0" onclick="rateIt(0)"><span>😶</span>Pas su</button><button class="r1" onclick="rateIt(1)"><span>🤔</span>Hésité</button><button class="r2" onclick="rateIt(2)"><span>😎</span>Je savais</button></div>';
  return h;
}
function tipBox(t){return '<div class="tip"><span class="ti">'+t.i+'</span><span>'+esc(t.t)+'</span></div>';}
function rateIt(r){
  SE.rate[SE.items[SE.i].id]=r;SE.shown=false;SE.i++;
  if(SE.i>=SE.items.length){SE.phase=1;SE.i=0;SE.ans=null;prepQ();}
  renderSeance();window.scrollTo(0,0);
}
/* le quiz pose la question dans l’autre sens */
function prepQ(){
  var n=SE.items[SE.i];
  var pool=S.notions.filter(function(x){return x.id!==n.id&&x.mat===n.mat&&norm(x.q)!==norm(n.q);}).map(function(x){return x.q;});
  var uniq=[];each(shuf(pool),function(q){if(uniq.indexOf(q)<0)uniq.push(q);});
  if(uniq.length>=3){SE.mode='qcm';SE.opts=shuf([n.q].concat(uniq.slice(0,3)));}else{SE.mode='type';SE.opts=[];}
  SE.ans=null;
}
function phaseQuiz(){
  var n=SE.items[SE.i],h='<div class="box qcard"><p class="qkicker">Dans l’autre sens : quel est le mot ou la notion ?</p><div class="qterm" style="font-size:1.5rem">'+esc(n.a)+'</div></div>';
  if(SE.mode==='qcm'){
    h+='<div class="opts">';each(SE.opts,function(o,k){var c='';if(SE.ans!==null){if(o===n.q)c=' good';else if(k===SE.ans)c=' bad';}h+='<button class="opt'+c+'"'+(SE.ans!==null?' disabled':'')+' onclick="pickOpt('+k+')">'+esc(o)+'</button>';});h+='</div>';
  }else{
    h+='<input id="qin" class="dict-in" placeholder="Écris ta réponse" autocomplete="off" autocapitalize="off" spellcheck="false"'+(SE.ans!==null?' disabled value="'+esc(SE.typed||'')+'"':'')+'>';
    if(SE.ans===null)h+='<button class="btn b-main b-full" style="margin-top:10px" onclick="checkType()">Vérifier</button>';
  }
  if(SE.ans!==null){
    var ok=SE.quiz[n.id];
    h+='<div class="fb '+(ok?'good':'bad')+'"><b>'+(ok?'Bien joué !':'Pas cette fois.')+'</b><br>'+(ok?'':'La réponse : <b>'+esc(n.q)+'</b>')+(SE.near?'<br>Presque : vérifie les accents.':'')+'</div>';
    h+=tipBox(D.tips[(SE.i+1)%D.tips.length]);
    h+='<button class="btn b-main b-full" style="margin-top:12px" onclick="nextQ()">'+(SE.i+1>=SE.items.length?'Voir ma récolte':'Suivante')+'</button>';
  }
  return h;
}
function pickOpt(k){var n=SE.items[SE.i];SE.ans=k;SE.near=false;SE.quiz[n.id]=SE.opts[k]===n.q;sfx(SE.quiz[n.id]?'good':'bad');renderSeance();}
function checkType(){
  var n=SE.items[SE.i],v=$('qin').value;if(!norm(v)){toast('Écris une réponse, même incertaine');return;}
  var a=norm(v),b=norm(n.q);SE.typed=v;SE.near=false;
  var ok=a===b||a===norm(b.replace(/^to /,''));
  if(!ok&&noAcc(a)===noAcc(b)){ok=true;SE.near=true;}
  SE.quiz[n.id]=ok;SE.ans=1;sfx(ok?'good':'bad');renderSeance();
}
function nextQ(){SE.i++;if(SE.i>=SE.items.length){finishSeance();SE.phase=2;}else prepQ();renderSeance();window.scrollTo(0,0);}
function finishSeance(){
  var gain=0;SE.lvl0=lvlInfo(S.drops).n;
  each(SE.items,function(n){
    var r=SE.rate[n.id],q=SE.quiz[n.id];
    var out=q?r:(r===2?1:0);
    if(q&&r===0)out=1;
    n.rev++;
    if(out===0){if(n.stage>0)n.lap++;n.stage=1;n.next=addD(1);}
    else if(out===1){n.stage=Math.max(1,n.stage);n.next=addD(Math.max(1,Math.round(INT[n.stage]*0.6)));}
    else{var was=n.stage;n.stage=Math.min(5,n.stage+1);n.next=addD(was===5?60:INT[n.stage]);}
    if(n.stage>SE.before[n.id])JUST[n.id]=1;
    gain+=out===2?3:out===1?2:1;
  });
  S.drops+=gain;SE.gain=gain;
  var t=today(),s=S.streak;
  if(s.last!==t){s.n=(s.last&&daysBetween(s.last,t)===1)?s.n+1:1;s.last=t;}
  save();SE.lvl1=lvlInfo(S.drops).n;setTimeout(function(){sfx('win');},150);setTimeout(function(){questDone('water');},900);
}
function phaseRecolte(){
  var N=SE.items.length,thought=0,conf=0,wrongConf=0,lucky=0,okQ=0;
  each(SE.items,function(n){var r=SE.rate[n.id],q=SE.quiz[n.id];if(q)okQ++;if(r===2){thought++;if(q)conf++;else wrongConf++;}if(r===0&&q)lucky++;});
  var h='<div class="box" style="text-align:center"><div class="big-n">+'+SE.gain+' '+spr('drop',52,'','')+'</div>'+(SE.lvl1>SE.lvl0?'<div class="levelup">⭐ NIVEAU '+SE.lvl1+' : '+esc(lvlInfo(S.drops).title)+' !</div>':'')+'<h2 class="ttl" style="margin-top:6px">Jardin arrosé !</h2><p class="sub">'+okQ+' bonne'+(okQ>1?'s':'')+' réponse'+(okQ>1?'s':'')+' sur '+N+' au quiz.</p>';
  h+='<div class="harvest">';each(SE.items,function(n){var b=SE.before[n.id];h+='<div class="hv"><span class="ems">'+stageSpr(b,30)+(n.stage!==b?'▶'+stageSpr(n.stage,30):'')+'</span><span><b>'+esc(n.q)+'</b><br><span class="muted">revoir le '+fmt(n.next)+'</span></span></div>';});h+='</div>';
  var c='';
  if(thought===0&&lucky===0)c='Tu as été prudent·e : tu ne t’es dit sûr·e de rien. La prochaine fois, ose « Je savais » quand tu retrouves la réponse.';
  else{c='Tu pensais savoir <b>'+thought+'</b> notion'+(thought>1?'s':'')+'. Le quiz en confirme <b>'+conf+'</b>.';
    if(wrongConf)c+=' Attention : '+wrongConf+' fois, tu te croyais sûr·e alors que non. C’est normal, et c’est exactement ce que la séance sert à repérer.';
    else if(thought)c+=' Tu te connais bien, bravo.';
    if(lucky)c+=' Et tu en savais '+lucky+' de plus que tu ne le croyais !';}
  h+='<div class="calib">🪞 '+c+'</div>';
  h+='<button class="btn b-main b-full" onclick="SE=null;go(\'jardin\')">Voir mon jardin</button><button class="btn b-soft b-full" onclick="SE=null;go(\'menu\')">Menu</button></div>';
  return h;
}

  var h='<h1 class="page-ttl">Créer un paquet</h1><p class="page-sub">Vos élèves le plantent d’un geste : par lien (ENT, Pronote, QR code) ou par fichier.</p><div class="box">';
  h+='<div class="field"><label for="pt">Titre du paquet</label><input id="pt" value="'+esc(PK.t)+'" placeholder="Ex : Unit 3 — Food vocabulary" oninput="PK.t=this.value"></div>';
  h+='<div class="row" style="align-items:flex-start"><div class="field" style="flex:1;min-width:160px"><label for="pm">Matière</label><input id="pm" value="'+esc(PK.m)+'" oninput="PK.m=this.value"></div><div class="field" style="flex:1;min-width:160px"><label for="pl">Langue d’écoute</label><select id="pl" onchange="PK.l=this.value">'+langOpts(PK.l)+'</select></div></div>';
  h+='<div class="field"><label for="pr">Une graine par ligne : question | réponse</label><textarea id="pr" style="min-height:180px" placeholder="breakfast | petit-déjeuner&#10;to cook | cuisiner" oninput="PK.raw=this.value">'+esc(PK.raw)+'</textarea></div>';
  h+='<div class="row"><button class="btn b-main" onclick="makeLink()">🔗 Fabriquer le lien</button><button class="btn b-soft" onclick="makeFile()">📥 Télécharger le fichier</button><button class="btn b-soft" onclick="testPack()">👀 Tester côté élève</button></div><div id="pout"></div></div>';
  h+='<div class="box"><h2 class="ttl" style="font-size:1.2rem">Bon à savoir</h2><p class="sub">Le paquet voyage dans le lien lui-même : rien n’est stocké sur un serveur. Au-delà d’une soixantaine de graines, le lien devient très long ; préférez alors le fichier. Les élèves gardent leurs données sur leur propre appareil : vous ne voyez pas leurs résultats.</p></div>';
  return h;
}
function curPack(){var its=parseLines(PK.raw);if(!its.length){toast('Ajoutez au moins une ligne question | réponse');return null;}return {cogni:'paquet',t:PK.t||PK.m||'Paquet',m:(PK.m||'Général').replace(/^\s+|\s+$/g,''),l:PK.l,i:its};}
function makeLink(){var p=curPack();if(!p)return;var u=encodePack(p);$('pout').innerHTML='<div class="field" style="margin-top:14px"><label>Lien à partager ('+p.i.length+' graines, '+u.length+' caractères)</label><textarea class="linkbox" id="plink" readonly>'+esc(u)+'</textarea>'+(u.length>2000?'<p class="hint">Lien long : certains outils peuvent le couper. Le fichier est plus sûr.</p>':'')+'</div><button class="btn b-water b-sm" onclick="copyLink()">📋 Copier le lien</button>';}
function copyLink(){var t=$('plink');t.focus();t.select();try{t.setSelectionRange(0,99999);}catch(e){}var ok=false;try{ok=document.execCommand('copy');}catch(e){}if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t.value).then(function(){toast('Lien copié');},function(){toast(ok?'Lien copié':'Sélectionnez le lien et copiez-le');});}else toast(ok?'Lien copié':'Sélectionnez le lien et copiez-le');}
function makeFile(){var p=curPack();if(p)download('paquet-'+slug(p.t)+'.json',p);}
function testPack(){var p=curPack();if(p)offerPack(p);}

/* ---------- RÉGLAGES ---------- */
function openSettings(){
  sheet('<h3>Réglages</h3><div class="field"><label for="sn">Prénom</label><input id="sn" value="'+esc(S.name)+'" maxlength="30"></div>'+
  '<div class="row" style="margin-bottom:14px"><button class="btn b-main b-sm" onclick="var v=$(\'sn\').value.replace(/^\\s+|\\s+$/g,\'\');if(v){S.name=v;save();closeSheet();render();}">Enregistrer</button></div>'+
  '<p class="sub" style="margin-bottom:6px">Son</p><div class="row" style="margin-bottom:14px"><button class="btn '+(S.mute?'b-soft':'b-main')+' b-sm" onclick="S.mute=!S.mute;save();openSettings();sfx(\'good\')">'+(S.mute?'🔇 Coupé':'🔊 Activé')+'</button></div><p class="sub" style="margin-bottom:6px">Mode</p><div class="row" style="margin-bottom:14px"><button class="btn '+(S.role==='eleve'?'b-main':'b-soft')+' b-sm" onclick="setRole(\'eleve\')">🎒 Élève</button><button class="btn '+(S.role==='prof'?'b-main':'b-soft')+' b-sm" onclick="setRole(\'prof\')">🧑‍🏫 Prof</button></div>'+
  '<p class="sub" style="margin-bottom:6px">Sauvegarde (pour changer d’appareil)</p><div class="row" style="margin-bottom:14px"><button class="btn b-soft b-sm" onclick="download(\'cognicoach-sauvegarde-\'+today()+\'.json\',S)">📤 Exporter</button><button class="btn b-soft b-sm" onclick="closeSheet();importFile(\'backup\')">📥 Restaurer</button></div>'+
  '<div class="acts"><button class="btn b-danger b-sm" onclick="resetAll()">Tout effacer</button><button class="btn b-soft b-sm" onclick="closeSheet()">Fermer</button></div>');
}
function setRole(r){S.role=r;save();closeSheet();go('menu');}
function resetAll(){ask('Tout effacer ?','Ton jardin, tes graines et tes gouttes disparaîtront de cet appareil. Pense à exporter une sauvegarde avant.','Tout effacer',true,function(){S=blank();try{localStorage.removeItem(KEY);localStorage.removeItem(OLD);}catch(e){}memStore={};_role='';_step=0;VIEW='menu';render();});}

/* ---------- DÉMARRAGE ---------- */
document.addEventListener('keydown',function(e){if(e.keyCode===27&&$('ov').className.indexOf('op')>-1)closeSheet();});
window.addEventListener('hashchange',checkHash);
load();
VIEW='title';
render();
checkHash();
var _origHello=doHello;
doHello=function(){_origHello();if(window._pendingPack){var o=window._pendingPack;window._pendingPack=null;offerPack(o);}};

</script>
</body>
